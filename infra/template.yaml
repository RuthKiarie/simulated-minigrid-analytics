AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Mini-grid simulation pipeline: encrypted S3 bucket (raw/curated/quarantine),
  anomaly-detector Lambda triggered by curated uploads, SNS email alerts,
  and CloudWatch log retention, alarm and metric.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives alert notifications.
  PandasLayerArn:
    Type: String
    Description: >-
      ARN of the AWS SDK for pandas managed layer for Python 3.12, x86_64,
      in the SAME region as this stack (it provides pandas and pyarrow).
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: How long Lambda logs are kept.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokePermission
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt AnomalyFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: curated/
                  - Name: suffix
                    Value: .csv

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnomalyFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-anomaly-detector"
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCuratedOnly
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/curated/*"
              - Sid: PublishAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${FunctionLogGroup.Arn}:*"

  AnomalyFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-anomaly-detector"
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: anomaly_lambda.lambda_handler
      Role: !GetAtt FunctionRole.Arn
      Code: ../src
      Layers:
        - !Ref PandasLayerArn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertTopic

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The anomaly detector Lambda raised an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnomalyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  AlertCountMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogGroup
      FilterPattern: "?silent_meter ?distribution_loss ?voltage_sag ?diesel_spike"
      MetricTransformations:
        - MetricNamespace: MiniGrid
          MetricName: AnomalyAlerts
          MetricValue: "1"

  # ---- Analytics layer: Glue catalogue, Athena workgroup ------------------
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: minigrid
        Description: Mini-grid simulation tables; typed views are in sql/athena_views.sql

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-wg"
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  RawTelemetryTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: raw_telemetry
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/curated/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.OpenCSVSerde
            Parameters:
              separatorChar: ","
              quoteChar: "\""
              escapeChar: "\\"
          Columns:
              - Name: ts_raw
                Type: string
              - Name: site
                Type: string
              - Name: meter_id
                Type: string
              - Name: feeder_id
                Type: string
              - Name: kwh
                Type: string
              - Name: voltage_v
                Type: string
              - Name: battery_soc_pct
                Type: string
              - Name: diesel_runtime_min
                Type: string
              - Name: irradiance_wm2
                Type: string
              - Name: site_generation_kwh
                Type: string
              - Name: site_net_supply_kwh
                Type: string

  RawCustomersTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: raw_customers
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/raw/customers/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.OpenCSVSerde
            Parameters:
              separatorChar: ","
              quoteChar: "\""
              escapeChar: "\\"
          Columns:
              - Name: customer_id
                Type: string
              - Name: site
                Type: string
              - Name: tier
                Type: string
              - Name: tariff_usd_per_kwh
                Type: string

  RawLedgerTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: raw_ledger
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/raw/ledger/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.OpenCSVSerde
            Parameters:
              separatorChar: ","
              quoteChar: "\""
              escapeChar: "\\"
          Columns:
              - Name: customer_id
                Type: string
              - Name: site
                Type: string
              - Name: tier
                Type: string
              - Name: month
                Type: string
              - Name: billed_kwh
                Type: string
              - Name: billed_usd
                Type: string
              - Name: currency
                Type: string
              - Name: billed_amount_local
                Type: string
              - Name: collected_amount_local
                Type: string
              - Name: payment_status
                Type: string
              - Name: days_overdue
                Type: string

  # ---- Analytics layer: Glue catalogue, Athena workgroup ------------------





Outputs:
  BucketName:
    Value: !Ref DataBucket
  TopicArn:
    Value: !Ref AlertTopic
  FunctionName:
    Value: !Ref AnomalyFunction
  LogGroup:
    Value: !Ref FunctionLogGroup
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  GlueDatabaseName:
    Value: !Ref GlueDatabase
